plugins {
    id 'com.android.application'
    id 'kotlin-android'
    // Hilt
    id 'kotlin-kapt'
    id 'dagger.hilt.android.plugin'
    // Navigation pass data
    id 'androidx.navigation.safeargs'
    // Google maps
    id 'com.google.android.libraries.mapsplatform.secrets-gradle-plugin'
    // Parcelable implementation generator
    id 'kotlin-parcelize'
    id 'org.jetbrains.kotlin.android'
}

android {
    compileSdk 33

    defaultConfig {
        applicationId "com.myproject.radiojourney"
        minSdk 19
        targetSdk 33
        versionCode 2
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        multiDexEnabled true

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        // Название файла
        applicationVariants.all { variant ->
            variant.outputs.all { output ->

                def APP_TITLE = "RadioJourney"
                def SEPARATOR = "_"

                // какой билд (зависит от того, какой выбрали в Active Build Variant)
                def buildType = variant.buildType.name
                // versionName, который мы указали в defaultConfig -> versionName
                def version = variant.versionName
                // инициализация объекта даты
                def date = new Date()
                // указываем формат даты типа "09.11.21"
                def formattedDate = date.format('dd.MM.yy')

                // объединяем все в одну строчку
                def apkName = APP_TITLE + SEPARATOR + buildType + SEPARATOR + formattedDate + ".apk"

                // создем APK файл с названием $apkName
                outputFileName = new File(apkName)
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    // View binding
    buildFeatures {
        viewBinding = true
    }
}

dependencies {

//    implementation 'androidx.appcompat:appcompat:1.5.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.1'
    implementation 'androidx.core:core-ktx:1.10.0'
    testImplementation 'junit:junit:4.+'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    // Material design
    implementation 'com.google.android.material:material:1.8.0'

    // Architectural components (ViewModel)
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.1"

    // Lifecycle
    implementation "androidx.lifecycle:lifecycle-extensions:2.2.0"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.6.1"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.6.1"

//    // Coroutines ?
//    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.3.9'
//    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.3.9'
//
//    // Activity KTX for viewModels() ?
//    implementation 'androidx.activity:activity-ktx:1.1.0'

    // Hilt
    implementation "com.google.dagger:hilt-android:2.45"
    kapt "com.google.dagger:hilt-android-compiler:2.45"

    // Room
    implementation "androidx.room:room-runtime:2.5.1"
    kapt "androidx.room:room-compiler:2.5.1"
    implementation "androidx.room:room-ktx:2.5.1"

    // Retrofit & OkHttp
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'

    // For activityViewModels working:
    // Java language implementation
    implementation "androidx.fragment:fragment-ktx:1.5.7"
    // Kotlin
    implementation "androidx.fragment:fragment-ktx:1.5.7"
    // Testing Fragments in Isolation
    debugImplementation "androidx.fragment:fragment-testing:1.5.7"

    //  Glide
    implementation 'com.github.bumptech.glide:glide:4.12.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.12.0'

    // Navigation
    implementation 'androidx.navigation:navigation-fragment-ktx:2.5.3'
    implementation 'androidx.navigation:navigation-ui-ktx:2.5.3'

    // Location
    implementation 'com.google.android.gms:play-services-location:19.0.1'
    // Google maps
    implementation 'com.google.android.gms:play-services-maps:18.0.0'

    // Music Player on Notification
    implementation 'androidx.media:media:1.6.0'

    // ExoPlayer
    implementation 'com.google.android.exoplayer:exoplayer-core:2.18.6'
    implementation 'com.google.android.exoplayer:exoplayer-ui:2.18.6'
    implementation 'com.google.android.exoplayer:extension-mediasession:2.18.6'
    // HlsMediaSource for playing .m3u8
    implementation 'com.google.android.exoplayer:exoplayer-hls:2.18.6'
}

kapt {
    // Дополнит. настройка, чтобы hilt показывал корректные сообщения об ошибке во время компиляции
    correctErrorTypes = true
}
plugins {
    id 'com.android.application'
    // Kotlin с AGP 9 встроен в Android Gradle plugin: плагины 'kotlin-android' / 'org.jetbrains.kotlin.android' больше не нужны
    // KSP вместо kapt для Hilt и Room (kapt не работал на JDK 21 со старым Kotlin и гораздо медленнее)
    id 'com.google.devtools.ksp'
    // Hilt
    id 'dagger.hilt.android.plugin'
    // Navigation pass data
    id 'androidx.navigation.safeargs'
    // Google maps
    id 'com.google.android.libraries.mapsplatform.secrets-gradle-plugin'
    // Parcelable implementation generator
    id 'org.jetbrains.kotlin.plugin.parcelize'
}

android {
    namespace 'com.myproject.radiojourney'
    compileSdk 36

    defaultConfig {
        // Адрес приложения в Google Play. Меняется только до первой публикации: потом это ключ всех обновлений.
        // io.github.<имя на GitHub> - обычный способ для проекта без своего домена
        applicationId "io.github.foxytheone.radiojourney"
        // Android 7.0 и выше: свежие Navigation и WorkManager не поддерживают Android 6, а это 0,3% устройств
        minSdk 24
        targetSdk 36
        versionCode 3
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        // Байткод для Java 17. Собирать можно на JDK 21 (JDK из Android Studio)
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding = true  // View binding
        buildConfig = true  // Включить генерацию BuildConfig для UserAgentInterceptor
    }
}

// Название APK: RadioJourney_1.0_16.09.26-debug.apk (тип сборки Gradle добавляет в конце сам).
// Раньше имя задавалось через android.applicationVariants, но в AGP 9 этого API больше нет
base {
    archivesName = "RadioJourney_${android.defaultConfig.versionName}_${new Date().format('dd.MM.yy')}"
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

ksp {
    // Room сохраняет схемы базы данных в app/schemas (нужны для миграций)
    arg("room.schemaLocation", "$projectDir/schemas")
}


dependencies {
    implementation 'androidx.core:core-ktx:1.18.0' // Also needed for doOnLayout
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

    // Material design
    implementation 'com.google.android.material:material:1.14.0'

    // Architectural components (ViewModel) & Lifecycle
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'

    // Hilt
    implementation "com.google.dagger:hilt-android:$hilt_version"
    ksp "com.google.dagger:hilt-android-compiler:$hilt_version"

    // Room
    implementation "androidx.room:room-runtime:2.8.5"
    ksp "androidx.room:room-compiler:2.8.5"
    implementation "androidx.room:room-ktx:2.8.5"

    // Retrofit & OkHttp
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'

    // For activityViewModels working:
    // Java language implementation, Kotlin
    implementation "androidx.fragment:fragment-ktx:1.9.1"
    // Testing Fragments in Isolation
    debugImplementation "androidx.fragment:fragment-testing:1.9.1"

//    //  Glide
//    implementation 'com.github.bumptech.glide:glide:4.12.0'
//    annotationProcessor 'com.github.bumptech.glide:compiler:4.12.0'

    // Navigation
    implementation 'androidx.navigation:navigation-fragment-ktx:2.10.2'
    implementation 'androidx.navigation:navigation-ui-ktx:2.10.2'

    // Location
    implementation 'com.google.android.gms:play-services-location:21.4.0'
    // Google maps
    implementation 'com.google.android.gms:play-services-maps:20.0.0'

    // Media3 (замена устаревшего com.google.android.exoplayer2):
    // ExoPlayer - плеер, exoplayer-hls - потоки .m3u8,
    // session - MediaLibraryService / MediaBrowser и уведомление плеера (вместо MediaSessionConnector и PlayerNotificationManager)
    implementation "androidx.media3:media3-exoplayer:$media3_version"
    implementation "androidx.media3:media3-exoplayer-hls:$media3_version"
    implementation "androidx.media3:media3-session:$media3_version"

    // WorkManager - фоновая загрузка списка стран (CountryCacheWorker), hilt-work - @Inject в Worker
    implementation 'androidx.work:work-runtime-ktx:2.12.0'
    implementation 'androidx.hilt:hilt-work:1.4.0'
    ksp 'androidx.hilt:hilt-compiler:1.4.0'

    // DataStore - хранилище пар ключ-значение вместо SharedPreferences (см. AppPreferenceStorage)
    implementation 'androidx.datastore:datastore-preferences:1.2.1'

    // Interceptor
    implementation 'com.squareup.okhttp3:logging-interceptor:5.4.0' // 5.5.0 требует compileSdk 37
}